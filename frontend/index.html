<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка в техпідтримку</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Заявка в техпідтримку</h1>

<div class="container">

    <!-- ФОРМА -->
    <div class="form-section">
        <form id="ticketForm">

            <label for="subject">Subject</label>
            <input type="text" id="subject">
            <div class="error" id="subjectError"></div>

            <label for="status">Status</label>
            <select id="status">
                <option value="">Оберіть статус</option>
            </select>
            <div class="error" id="statusError"></div>

            <label for="priority">Priority</label>
            <select id="priority">
                <option value="">Оберіть пріоритет</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
            </select>
            <div class="error" id="priorityError"></div>

            <label for="message">Message</label>
            <textarea id="message"></textarea>
            <div class="error" id="messageError"></div>

            <label for="author">Author</label>
            <input type="text" id="author" placeholder="Введіть ім'я автора">
            <div class="error" id="authorError"></div>

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="author@example.com">
            <div class="error" id="emailError"></div>

            <button type="submit">Зберегти</button>
            <button type="button" id="resetBtn">Очистити</button>

        </form>
    </div>

    <!-- СПИСОК -->
    <div class="list-section">

        <input type="text" id="search" placeholder="Пошук по Subject">

        <select id="filterStatus">
            <option value="">Всі статуси</option>
        </select>

        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Author</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

    </div>

</div>

<script src="script.js" defer></script>

</body>
</html>
