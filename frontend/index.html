<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заявки в техпідтримку</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

<div id="demoAuthBar" style="background:#1e293b;color:#e2e8f0;padding:8px 16px;font-size:0.85rem;display:flex;align-items:center;gap:12px;">
  <span>Demo Auth:</span>
  <select id="demoUserSelect" style="background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:4px 8px;">
    <option value="">-- Оберіть користувача --</option>
  </select>
  <span id="demoUserLabel" style="color:#94a3b8;font-size:0.8rem;">(для POST/PUT/DELETE)</span>
</div>

<div id="notice" class="notice"></div>

<h1>Заявки в техпідтримку</h1>

<div class="container">

  <!-- ФОРМА -->
  <div class="form-section">
    <h2 id="formTitle">Нова заявка</h2>

    <form id="ticketForm" novalidate>

      <label for="subject">Subject</label>
      <input type="text" id="subject" placeholder="Мінімум 3 символи" />
      <div class="field-error" id="subjectError"></div>

      <label for="status">Status</label>
      <select id="status">
        <option value="">Оберіть статус</option>
      </select>
      <div class="field-error" id="statusError"></div>

      <label for="priority">Priority</label>
      <select id="priority">
        <option value="">Оберіть пріоритет</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>
      <div class="field-error" id="priorityError"></div>

      <label for="message">Message</label>
      <textarea id="message" placeholder="Мінімум 10 символів"></textarea>
      <div class="field-error" id="messageError"></div>


      <div class="form-actions">
        <button type="submit" id="submitBtn" disabled>Зберегти</button>
        <button type="button" id="cancelBtn" style="display:none">Скасувати</button>
        <button type="button" id="resetBtn">Очистити</button>
      </div>

    </form>
  </div>

  <!-- СПИСОК -->
  <div class="list-section">

    <div class="filters">
      <input type="text" id="search" placeholder="Пошук по Subject" />
      <select id="filterStatus">
        <option value="">Всі статуси</option>
      </select>
      <select id="filterPriority">
        <option value="">Всі пріоритети</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>

    <div id="listStatus"></div>

    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Status</th>
          <th>Priority</th>
          <th>Author</th>
          <th>Дата</th>
          <th>Дії</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

  </div>

</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
